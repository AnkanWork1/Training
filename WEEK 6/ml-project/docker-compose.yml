services:

  backend:
    container_name: backend
    build:
      context: ./src
      dockerfile: deployment/DockerFile.backend
    ports:
      - "8000:8000"

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: src/deployment/DockerFile.frontend
    depends_on:
      - backend
    ports:
      - "8501:8501"
