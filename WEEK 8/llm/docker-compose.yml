services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: llm-backend
    container_name: llm-backend
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    image: llm-ui
    container_name: llm-ui
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
