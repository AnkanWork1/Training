version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: llm-backend
    container_name: llm-backend
    volumes:
      - ./quantized:/app/quantized
      - ./logs:/app/logs
      - ./llama.cpp/build/bin/llama-server:/app/llama-server
    ports:
      - "8000:8000"
    environment:
      - BASE_URL=http://backend:8080/v1
      - API_KEY=dummy

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    image: llm-ui
    container_name: llm-ui
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"